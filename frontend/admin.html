<style>
* { box-sizing: border-box; }
:root {
    --bg:#110b08; --glass:rgba(255,226,190,.07); --glass-strong:rgba(255,226,190,.12);
    --border:rgba(255,220,180,.14); --text:#f4e8d4; --muted:rgba(244,232,212,.58);
    --amber:#e0a45a; --danger:#ff7a90; --ok:#8fd19e;
}
html { color-scheme: dark; }
body {
    margin:0; min-height:100vh; color:var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
        radial-gradient(ellipse 70% 55% at 14% -8%, rgba(236,148,56,.30), transparent 72%),
        radial-gradient(ellipse 60% 45% at 92% 108%, rgba(160,56,56,.24), transparent 72%),
        var(--bg);
    padding-bottom: env(safe-area-inset-bottom);
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.bar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: calc(14px + env(safe-area-inset-top)) 22px 14px; background:rgba(24,14,9,.82); backdrop-filter:blur(22px); border-bottom:1px solid var(--border); }
.logo { display:flex; align-items:center; gap:9px; font-size:20px; font-weight:800; letter-spacing:-.5px; } .logo span { color:var(--amber); opacity:.8; }
.siteLogoMark { display:block; width:30px; height:30px; flex:0 0 30px; object-fit:contain; filter:drop-shadow(0 2px 8px rgba(145,175,255,.24)); }
.who { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); min-width:0; }
.who b { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px; }
.badge { padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; background:rgba(145,175,255,.16); border:1px solid rgba(145,175,255,.42); color:var(--amber); }
main { width:min(1100px, calc(100% - 32px)); margin:28px auto 80px; }
h1,h2 { font-family:"Cormorant Garamond", Georgia, serif; font-weight:600; margin:0 0 6px; }
h1 { font-size:40px; } h2 { font-size:28px; }
.muted { color:var(--muted); font-size:14px; }
.glass { background:linear-gradient(160deg, rgba(255,226,190,.085), rgba(255,226,190,.04)); border:1px solid var(--border); border-radius:22px; padding:22px; backdrop-filter:blur(20px); }
.tabs { display:flex; gap:6px; padding:4px; margin:22px 0; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid var(--border); overflow-x:auto; }
.tabs button { flex:1; min-width:110px; padding:10px 14px; border:0; border-radius:10px; background:transparent; color:var(--muted); font-weight:700; }
.tabs button.active { background:linear-gradient(135deg,#e6b06a,#c47f35); color:#1e1208; }
.tabs button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .stat.statBtn:focus-visible { outline:2px solid rgba(224,164,90,.8); outline-offset:2px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
.stat { padding:18px; border-radius:18px; background:rgba(255,255,255,.05); border:1px solid var(--border); }
.stat b { display:block; font-size:30px; } .stat span { color:var(--muted); font-size:13px; }
.stat.statBtn { display:block; width:100%; text-align:start; color:inherit; cursor:pointer; }
.navRow { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 16px; }
.crumb { color:var(--muted); font-size:13px; }
label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
input[type=text], input[type=search], input[type=email], select, textarea {
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,.07); color:var(--text); }
textarea { min-height:90px; resize:vertical; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:700px){ .row{grid-template-columns:1fr;} }
.check { display:flex; align-items:flex-start; gap:10px; margin-top:14px; font-size:14px; color:var(--text); }
.check input { margin-top:3px; accent-color:#9fb9ff; }
.btn { padding:11px 18px; border-radius:13px; border:1px solid var(--border); background:rgba(255,255,255,.07); color:var(--text); font-weight:650; transition:background .2s, transform .2s; }

.btn.danger { border-color:rgba(255,122,144,.6); color:var(--danger); }

.btn.sm { padding:7px 11px; font-size:12.5px; border-radius:10px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }

.toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; } .toolbar input { flex:1; min-width:180px; } .toolbar select { width:auto; }
.cov { width:44px; height:44px; border-radius:10px; background:rgba(255,255,255,.08); object-fit:cover; }
.overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; padding:20px; }

.hidden { display:none !important; }
.center { min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; }
audio { width:100%; margin-top:12px; }

.drop { border:2px dashed var(--border); border-radius:16px; padding:16px; text-align:center; color:var(--muted); cursor:pointer; margin-top:6px; }
.drop.over, .drop:focus-visible { border-color:#9fb9ff; background:rgba(145,175,255,.10); outline:none; }
.fileInfo { font-size:12.5px; margin-top:6px; color:var(--muted); } .fileInfo.bad { color:var(--danger); }
.pill.unreleased { color:#c9a7ff; border-color:#c9a7ff88; }

:root { --bg:#080b13; --glass:rgba(225,235,255,.075); --glass-strong:rgba(225,235,255,.14); --border:rgba(220,232,255,.18); --text:#f4f7ff; --muted:rgba(225,235,255,.62); --amber:#dce8ff; --ok:#9ee8c0; }
body { background:radial-gradient(ellipse 70% 50% at 12% 0%,rgba(92,120,255,.18),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 95%,rgba(55,190,220,.11),transparent 72%),var(--bg); }
.bar { background:rgba(9,14,26,.64); border-bottom:1px solid rgba(225,236,255,.17); box-shadow:0 12px 36px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.16); backdrop-filter:blur(28px) saturate(155%); -webkit-backdrop-filter:blur(28px) saturate(155%); }
.glass,.stat,.dlg,.tabs,.msg,.drop,.progress,.tableWrap { border-color:rgba(225,236,255,.18); box-shadow:0 22px 70px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.16); backdrop-filter:blur(24px) saturate(150%); -webkit-backdrop-filter:blur(24px) saturate(150%); }
.glass,.dlg { background:linear-gradient(145deg,rgba(240,246,255,.13),rgba(170,195,255,.045) 58%,rgba(255,255,255,.065)); }
.btn,.tabs button,.stat.statBtn { border:1px solid rgba(225,236,255,.2); background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(190,210,255,.055)); color:var(--text); box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 24px rgba(0,0,0,.12); backdrop-filter:blur(16px) saturate(150%); transition:transform .28s cubic-bezier(.2,.8,.2,1),background .28s,border-color .28s,box-shadow .28s; }
.btn:hover,.tabs button:hover,.stat.statBtn:hover { transform:translateY(-2px); border-color:rgba(230,240,255,.36); background:linear-gradient(145deg,rgba(255,255,255,.23),rgba(145,175,255,.13)); box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 14px 32px rgba(0,0,0,.22); }
button { border-color:rgba(225,236,255,.2); background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(170,195,255,.055)); color:var(--text); box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 22px rgba(0,0,0,.10); backdrop-filter:blur(15px) saturate(145%); transition:transform .28s cubic-bezier(.2,.8,.2,1),background .28s,border-color .28s,box-shadow .28s; }
button:hover { border-color:rgba(230,240,255,.34); background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(145,175,255,.12)); box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 28px rgba(0,0,0,.18); }
button:active { transform:scale(.975); }
.btn.primary,.tabs button.active { color:#f8faff; background:linear-gradient(135deg,rgba(150,175,255,.34),rgba(95,130,230,.20)); border:1px solid rgba(205,220,255,.32); }
input[type=text],input[type=search],input[type=email],select,textarea { background:rgba(225,235,255,.065); border-color:rgba(225,236,255,.18); box-shadow:inset 0 1px 0 rgba(255,255,255,.07); backdrop-filter:blur(14px); }
input:focus,select:focus,textarea:focus { outline:0; border-color:rgba(155,185,255,.7); box-shadow:0 0 0 3px rgba(115,150,255,.14),inset 0 1px 0 rgba(255,255,255,.1); }

.mf-review-player { padding:15px; border:1px solid rgba(225,236,255,.18); border-radius:18px; background:linear-gradient(145deg,rgba(240,246,255,.13),rgba(170,195,255,.045) 58%,rgba(255,255,255,.065)); box-shadow:0 18px 48px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter:blur(24px) saturate(150%); }
.mf-review-head { display:flex; align-items:center; gap:13px; min-width:0; }
.mf-review-cover { width:68px; height:68px; flex:0 0 68px; border-radius:13px; object-fit:cover; background:rgba(225,235,255,.08); box-shadow:0 8px 22px rgba(0,0,0,.25); }
.mf-review-title { color:var(--text); font-size:14px; font-weight:750; overflow-wrap:anywhere; }
.mf-review-artist { color:var(--muted); font-size:12px; margin-top:4px; }
.mf-review-controls { display:grid; grid-template-columns:42px minmax(0,1fr) auto; align-items:center; gap:10px; margin-top:16px; }
.mf-review-play { width:42px; height:42px; padding:0; border-radius:50%; font-size:15px; }

.barBrand { display:flex; align-items:center; gap:16px; min-width:0; }

#pageShell { min-height:100vh; opacity:1; transform:translateY(0); transition:opacity .22s ease,transform .22s ease; }

html.barba-leaving #pageShell { opacity:0; transform:translateY(8px); }

@media(max-width:700px) { .bar { padding-left:12px; padding-right:12px; flex-wrap:wrap; } .barBrand { gap:8px; } .logo { font-size:16px; } .backWebsite { padding:8px 9px; font-size:11px; } .who { flex-wrap:wrap; justify-content:flex-end; gap:6px; } main { width:calc(100% - 20px); margin-top:18px; } .glass { padding:16px; } }
@media(prefers-reduced-motion:reduce) { #pageShell{animation:none!important;transition:none!important} .btn,.tabs button,.stat.statBtn{transition:none!important} }
</style>

<body class="mf-admin" data-barba="wrapper">
<div id="pageShell" data-barba="container" data-barba-namespace="admin">
<div class="bar">
    <div class="barBrand"><div class="logo"><img class="siteLogoMark" src="/favicon-192x192.png" alt="" width="30" height="30" decoding="async">Music<span>Finder</span> · Admin</div><a class="backWebsite" href="/" aria-label="Back to MusicFinder website">← Back to Website</a></div>
    <div class="who" id="who"></div>
</div>

<main id="app"></main>
<div id="dialogHost"></div>
<div id="reauthHost"></div>

<script>
/* Public API origin only. Supabase credentials are supplied by the API, never hardcoded here. */
const currentHost = window.location.hostname;
const API_BASE = currentHost.startsWith("musicfinder-web-git-")
    ? "https://musicfinder-api" + currentHost.slice("musicfinder-web".length)
    : "https://musicfinder-api.vercel.app";

let idToken = null;          // kept in memory only (never written to storage)
let me = null;
let tab = "dashboard";
let tracksCache = [];
let tracksFilter = "";       // status filter applied when opening the Tracks view
let navStack = [];           // previous views, newest last (drives the Back button)
let reauthWait = null;

const ERR = {
    auth_required: "Please sign in.", session_expired: "Your session expired. Please sign in again.",
    email_not_verified: "Please verify your email before signing in.", not_authorized: "This account is not authorized for administration.",
    forbidden: "Only the owner can do that.", owner_protected: "The owner account cannot be changed.",
    cloud_not_configured: "The server storage is not configured yet.", storage_failed: "Storage error. Please retry.",
    storage_unavailable: "Storage is unreachable. Please retry.", bad_audio_type: "Unsupported audio type (use MP3, M4A, WAV, OGG or FLAC).",
    bad_cover_type: "Unsupported image type (use JPG, PNG or WebP).", audio_too_large: "Audio file is too large.",
    cover_too_large: "Cover image is too large (max 5 MB).", empty_file: "The file is empty.",
    bad_audio_file: "The uploaded file is not valid audio (its contents do not match its type).",
    bad_cover_file: "The uploaded cover is not a valid image.", upload_missing: "The file did not finish uploading.",
    title_required: "Title is required.", artist_required: "Artist is required.", bad_transition: "That status change is not allowed from the current state.",
    audio_missing: "Upload the audio file first.", rights_not_confirmed: "Confirm you have the rights to distribute this track.",
    unpublish_first: "Unpublish the track before changing that.", already_admin: "That account is already an administrator.",
    bad_email: "Enter a valid email address.", rate_limited: "Too many requests. Wait a minute.", not_found: "Not found.",
    finalize_failed: "Some files failed validation.", duplicate_request: "This submission was already received.",
    schema_outdated: "The database is missing a required column. Apply the pending migration, then retry.",
    network_error: "Could not reach the server. Check your connection and retry.",
    cloud_configuration_invalid: "The server's storage configuration is invalid.",
    storage_invalid_response: "Storage returned an unexpected response. Please retry.",
    auth_unavailable: "The sign-in service is unavailable right now. Please retry.",
    auth_mapping_unavailable: "Your account could not be linked to its MusicFinder data. Please retry.",
    nothing_to_upload: "There is nothing to upload.", bad_status: "Unknown status filter."
};
const STATUS_LABEL = { draft: "Draft", review: "Pending Review", published: "Published", unpublished: "Unpublished" };
const TAB_LABEL = { dashboard: "Dashboard", upload: "Upload", tracks: "Tracks", admins: "Administrators" };
const msgFor = c => ERR[c] || "Something went wrong. Please try again.";
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const $ = s => document.querySelector(s);

class ApiError extends Error { constructor(status, code, body) { super(code); this.status = status; this.code = code; this.body = body; } }

/* ---------- shared Supabase session + API ---------- */
async function rawFetch(path, { method = "GET", body } = {}) {
    let res;
    try {
        res = await fetch(API_BASE + path, {
            method,
            headers: { Authorization: "Bearer " + idToken, ...(body ? { "Content-Type": "application/json" } : {}) },
            body: body ? JSON.stringify(body) : undefined
        });
    } catch { throw new ApiError(0, "network_error"); }
    let data = null; try { data = await res.json(); } catch {}
    return { res, data };
}

async function api(path, opts = {}) {
    if (!idToken) throw new ApiError(401, "auth_required");
    let result = await rawFetch(path, opts);
    if (result.res.status === 401) {
        /* Supabase refreshes an expired access token from the persisted refresh token. */
        try {
            const session = await MFAuth.refreshSession();
            if (session && session.access_token && session.access_token !== idToken) {
                idToken = session.access_token;
                result = await rawFetch(path, opts);
            }
        } catch {}
    }
    if (!result.res.ok) {
        const d = result.data && result.data.detail;
        const code = d && typeof d === "object" ? d.code : "server";
        if (result.res.status === 401) {
            idToken = null; me = null;
            MFAuth.signOut().catch(() => {});
            renderSignIn(msgFor(code));
        }
        throw new ApiError(result.res.status, code, d);
    }
    return result.data;
}

function renderSignIn(note_) {
    $("#who").innerHTML = "";
    $("#app").innerHTML = `<div class="center"><h1>Administration</h1>
        <p class="muted">Sign in with your MusicFinder account. Administrator access is checked by the server for every action.</p>
        ${note_ ? `<div class="msg err">${esc(note_)}</div>` : ""}
        <button class="btn primary" id="adminSignIn" type="button">Sign in</button></div>`;
    $("#adminSignIn").onclick = () => MFLoginPanel.open("login");
}

async function boot() {
    try {
        me = await api("/admin/me");
    } catch (e) {
        if (e.status === 401) return;                                  // api() already rendered sign-in
        idToken = null;
        return renderSignIn(msgFor(e.code));
    }
    $("#who").innerHTML = `<span class="badge">${me.role === "owner" ? "OWNER" : "ADMIN"}</span><b>${esc(me.email)}</b><button class="btn sm" id="out">Sign out</button>`;
    $("#out").onclick = async () => {
        idToken = null; me = null; pending = null; createRequestId = null; navStack = []; tab = "dashboard"; tracksFilter = "";
        reauthWait = null; $("#reauthHost").innerHTML = ""; closeDlg();
        try { await MFAuth.signOut(); } catch {}
        renderSignIn();
    };
    navStack = []; tab = "dashboard"; tracksFilter = "";
    commit("replace");
}

/* ---------- navigation (Back button + browser history) ---------- */
const snap = () => ({ tab, filter: tracksFilter, stack: navStack.map(x => ({ tab: x.tab, filter: x.filter })) });
function commit(mode) {
    try { history[mode === "replace" ? "replaceState" : "pushState"](snap(), "", "#" + tab); } catch {}
    renderShell();
}
function openTab(k) { navStack = []; tab = k; tracksFilter = ""; commit("push"); }                    // top-level tab: no Back button
function drillInto(k, filter) { navStack.push({ tab, filter: tracksFilter }); tab = k; tracksFilter = filter || ""; commit("push"); }
function goBack() {
    const prev = navStack.pop();
    if (!prev) return;
    tab = prev.tab; tracksFilter = prev.filter || "";
    commit("push");
}
window.addEventListener("popstate", e => {                         // browser / phone back button
    const st = e.state;
    if (!st || !me) return;
    tab = TAB_LABEL[st.tab] ? st.tab : "dashboard";
    tracksFilter = st.filter || "";
    navStack = Array.isArray(st.stack) ? st.stack.map(x => ({ tab: x.tab, filter: x.filter || "" })) : [];
    renderShell();
});

/* ---------- shell ---------- */
function renderShell() {
    if (tab === "admins" && me.role !== "owner") tab = "dashboard";
    const tabs = [["dashboard", "Dashboard"], ["upload", "Upload"], ["tracks", "Tracks"]];
    if (me.role === "owner") tabs.push(["admins", "Administrators"]);

const liveXhrs = new Set();
function putFile(url, file, contentType, onProgress) {
    return new Promise((resolve, reject) => {

        const done = fn => v => { liveXhrs.delete(x); fn(v); };
        resolve = done(resolve); reject = done(reject);
        x.onabort = () => reject(new Error("upload_cancelled"));
        x.open("PUT", url);
        x.timeout = 180000;
        x.setRequestHeader("Content-Type", contentType);
        x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
        x.onload = () => (x.status >= 200 && x.status < 300 ? resolve() : reject(new Error("upload_http_" + x.status)));
        x.onerror = () => reject(new Error("upload_network"));
        x.ontimeout = () => reject(new Error("upload_timeout"));

}

async function uploadWithRetry(kind, file, initialUpload, onProgress) {

        if (stopped) throw new Error("upload_cancelled");
        try {
            await putFile(signed.url, file, signed.content_type, onProgress);
            return;
        } catch (error) {
            if (error.message === "upload_cancelled" || stopped) throw new Error("upload_cancelled");
            const status = /^upload_http_(\d+)$/.exec(error.message || "");
            const retryable = error.message === "upload_network" || error.message === "upload_timeout" ||
                !!(status && ([401,403,408,429].includes(Number(status[1])) || Number(status[1]) >= 500));
            if (!retryable || attempt === 2) throw error;
            await wait(500 * (attempt + 1));
            if (stopped) throw new Error("upload_cancelled");
            // Renew the signed URL for this file only. This also replaces an object
            // whose upload may have completed server-side before the connection dropped.
            const refreshed = await api(`/admin/tracks/${pending.trackId}/upload-urls`, {
                method: "POST", body: { [kind]: decl(file) }
            });
            signed = refreshed.uploads && refreshed.uploads[kind];
            if (!signed || !signed.url) throw new Error("storage_invalid_response");
            onProgress(0);
        }

}

            : (n === 400 || n === 415) ? "Storage rejected the file type or size (check the bucket limits)."
            : (n === 401 || n === 403) ? "The upload link expired or is invalid. Press retry to get a new one."
            : "Press retry.";
        return `Storage refused the upload (HTTP ${n}). ${hint}`;
    }
    if (e && e.message === "upload_network") return "Network error while uploading. Check your connection and press retry.";
    if (e && e.message === "upload_timeout") return "The upload took too long and timed out. Your draft is kept; press Retry upload to continue.";
    return null;
}

async function doUpload() {

    const pickedAudio = $("#fAudio").files[0], pickedCover = $("#fCover").files[0];
    const title = $("#fTitle").value.trim(), artist = $("#fArtist").value.trim();
    if (!title) return note(msg, msgFor("title_required"));
    if (!artist) return note(msg, msgFor("artist_required"));

    if (needAudio && !audio) return note(msg, "Choose an audio file.");

            pending = { trackId: r.track.id, uploads: r.uploads, audio, cover,
                audioUploaded: false, coverUploaded: false, audioDone: false, coverDone: false, meta };

            pending.audioUploaded = true;

        if (U.cover && !pending.coverUploaded && !pending.coverDone && pending.cover) tasks.push((async () => {
            await uploadWithRetry("cover", pending.cover, U.cover, f => { bar("#pC")(f); const s = $("#upStatus"); if (s) s.textContent = `Uploading cover · ${Math.round(f * 100)}%`; });

            if (a === "published" && !(await confirmDlg(`Publish "${t.title}"? It becomes publicly searchable and playable.`, "Publish"))) return;
            if (a === "unpublished" && !(await confirmDlg(`Unpublish "${t.title}"? It disappears from public search and playback.`, "Unpublish", true))) return;
            await api(`/admin/tracks/${id}/status`, { method: "POST", body: { status: a } });
        }
        loadTracks();
    } catch (e) { note(msg, msgFor(e.code)); }
}
async function previewDlg(t) {
    const h = dialog(`<h2>${esc(t.title)}</h2><p class="muted">${esc(t.artist)}</p><div id="pv" class="muted">Loading…</div><div class="actions"><button class="btn" id="pvX">Close</button></div>`);
    h.querySelector("#pvX").onclick = closeDlg;
    try {
        const r = await api(`/admin/tracks/${t.id}/preview`);
        const box = h.querySelector("#pv");
        if (!box || !document.querySelector("#dialogHost .overlay")) return;
        if (!r.audio_url) { box.innerHTML = `<div class="msg err">No audio uploaded yet.</div>`; return; }
        box.innerHTML = `<div class="mf-review-player">
            <div class="mf-review-head">
                ${r.cover_url ? `<img class="mf-review-cover" alt="Cover" src="${esc(r.cover_url)}">` : `<div class="mf-review-cover"></div>`}
                <div style="min-width:0"><div class="mf-review-title">${esc(t.title)}</div><div class="mf-review-artist">${esc(t.artist)} · Review preview</div></div>
            </div>
            <div class="mf-review-controls">
                <button class="mf-review-play" id="rvPlay" type="button" aria-label="Play preview">▶</button>
                <input class="mf-review-seek" id="rvSeek" type="range" min="0" max="1000" value="0" aria-label="Seek preview">
                <span class="mf-review-time" id="rvTime">0:00 / 0:00</span>
            </div>
            <div class="mf-review-volume-row"><span>Volume</span><input class="mf-review-volume" id="rvVolume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Preview volume"></div>
            <audio id="rvAudio" preload="none" src="${esc(r.audio_url)}"></audio>
        </div>`;
        const audio = box.querySelector("#rvAudio"), play = box.querySelector("#rvPlay"), seek = box.querySelector("#rvSeek"), time = box.querySelector("#rvTime");
        const fmt = seconds => { if (!Number.isFinite(seconds) || seconds < 0) return "0:00"; const n = Math.floor(seconds); return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")}`; };
        const update = () => {
            const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
            seek.value = duration ? String(Math.round(audio.currentTime / duration * 1000)) : "0";
            time.textContent = `${fmt(audio.currentTime)} / ${fmt(duration)}`;
        };
        play.onclick = async () => {
            if (audio.paused) { try { await audio.play(); } catch { play.title = "Playback was blocked. Press Play again."; } }
            else audio.pause();
        };
        audio.addEventListener("play", () => { play.textContent = "Ⅱ"; play.setAttribute("aria-label", "Pause preview"); });
        audio.addEventListener("pause", () => { play.textContent = "▶"; play.setAttribute("aria-label", "Play preview"); });
        audio.addEventListener("timeupdate", update);
        audio.addEventListener("loadedmetadata", update);
        audio.addEventListener("ended", update);
        audio.addEventListener("error", () => { time.textContent = "Preview unavailable"; });
        seek.addEventListener("input", () => { if (Number.isFinite(audio.duration)) audio.currentTime = audio.duration * Number(seek.value) / 1000; });
        box.querySelector("#rvVolume").addEventListener("input", event => { audio.volume = Number(event.target.value); });
    } catch (e) {
        const box = h.querySelector("#pv");
        if (box) box.innerHTML = `<div class="msg err">${esc(msgFor(e.code))}</div>`;
    }
}
function editDlg(t) {
    const h = dialog(`<h2>Edit track</h2>
        <label for="eT">Title</label><input id="eT" type="text" maxlength="200" value="${esc(t.title)}">
        <label for="eA">Artist</label><input id="eA" type="text" maxlength="200" value="${esc(t.artist)}">
        <label for="eAl">Album</label><input id="eAl" type="text" maxlength="200" value="${esc(t.album)}">
        <label for="eD">Description</label><textarea id="eD" maxlength="2000">${esc(t.description)}</textarea>
        <label class="check"><input type="checkbox" id="eR" ${t.rights_confirmed ? "checked" : ""}> <span>I have the rights to distribute this track.</span></label>
        <label class="check"><input type="checkbox" id="eUn" ${t.is_unreleased ? "checked" : ""}> <span>Unreleased song (shows an Unreleased badge publicly).</span></label>
        <label>Cover</label><div id="eCov" class="muted">Loading…</div>
        <div class="drop" id="dzE" tabindex="0" role="button">Drop a new cover here or click to choose</div><input id="eCf" type="file" class="hidden" accept=".jpg,.jpeg,.png,.webp,image/*">
        <div class="actions"><button class="btn sm danger ${t.has_cover ? "" : "hidden"}" id="eCrm" type="button">Remove cover</button></div><div id="eCm"></div>
        <label class="check"><input type="checkbox" id="eDl" ${t.download_enabled ? "checked" : ""}> <span>Allow public download.</span></label>
        <div id="eM"></div><div class="actions"><button class="btn primary" id="eS">Save</button><button class="btn" id="eX">Cancel</button></div>`);
    h.querySelector("#eX").onclick = closeDlg;
    const showCover = async () => {
        const box = h.querySelector("#eCov");
        try { const r = await api(`/admin/tracks/${t.id}/preview`); box.innerHTML = r.cover_url ? `<img class="cov" style="width:120px;height:120px" alt="Current cover" src="${esc(r.cover_url)}">` : "No cover yet."; }
        catch (e) { box.textContent = msgFor(e.code); }
    };
    showCover();
    const cm = h.querySelector("#eCm"), inp = h.querySelector("#eCf"), dz = h.querySelector("#dzE");
    dz.onclick = () => inp.click();
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); }; dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) setFile(inp, f); };
    inp.onchange = async () => {                                             // replace: old cover stays until the new one is verified
        const f = inp.files[0]; if (!f) return;
        const pr = fileProblem("cover", f); if (pr) return note(cm, pr);
        note(cm, "Uploading cover…", "ok");
        try {
            const r = await api(`/admin/tracks/${t.id}/upload-urls`, { method: "POST", body: { cover: decl(f) } });
            await putFile(r.uploads.cover.url, f, r.uploads.cover.content_type, () => {});
            await api(`/admin/tracks/${t.id}/finalize`, { method: "POST", body: { audio: false, cover: true } });
            t.has_cover = true; h.querySelector("#eCrm").classList.remove("hidden"); note(cm, "Cover updated.", "ok"); showCover(); loadTracks();
        } catch (e) { note(cm, e.body?.files?.cover ? msgFor(e.body.files.cover) : (e.code ? msgFor(e.code) : (uploadFailMessage(e) || "Cover upload failed. Please retry."))); }
        inp.value = "";
    };
    h.querySelector("#eCrm").onclick = async () => {
        if (!(await confirmDlg("Remove this track's cover image?", "Remove", true))) return;
        try { await api(`/admin/tracks/${t.id}/cover`, { method: "DELETE" }); t.has_cover = false; h.querySelector("#eCrm").classList.add("hidden"); note(cm, "Cover removed.", "ok"); showCover(); loadTracks(); }
        catch (e) { note(cm, msgFor(e.code)); }
    };
    h.querySelector("#eS").onclick = async () => {
        try {
            await api(`/admin/tracks/${t.id}`, { method: "PATCH", body: { title: h.querySelector("#eT").value, artist: h.querySelector("#eA").value, album: h.querySelector("#eAl").value,
                description: h.querySelector("#eD").value, rights_confirmed: h.querySelector("#eR").checked, is_unreleased: h.querySelector("#eUn").checked, download_enabled: h.querySelector("#eDl").checked } });
            closeDlg(); loadTracks();
        } catch (e) { note(h.querySelector("#eM"), msgFor(e.code)); }
    };
}

/* ---------- administrators (owner only; the server enforces this independently) ---------- */
async function viewAdmins() {
    const p = $("#panel");
    p.innerHTML = `<div class="glass"><h2>Administrators</h2><p class="muted">New administrators must sign in with a verified MusicFinder account using this exact email. Only the owner can manage this list; the owner account itself cannot be changed here.</p>
        <div class="toolbar"><input type="email" id="aE" placeholder="admin@example.com" aria-label="New administrator email"><button class="btn primary" id="aAdd">Add administrator</button></div><div id="aM"></div><div class="tableWrap" id="aL">Loading…</div></div>`;
    $("#aAdd").onclick = async () => {
        try { await api("/admin/admins", { method: "POST", body: { email: $("#aE").value } }); $("#aE").value = ""; load(); }
        catch (e) { note($("#aM"), msgFor(e.code)); }
    };
    async function load() {
        try {
            const r = await api("/admin/admins");
            $("#aL").innerHTML = `<table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${r.admins.map(a => `<tr><td>${esc(a.email)}</td><td>${esc(a.role)}</td><td>${a.revoked_at ? "revoked" : "active"}</td>
                <td>${a.role === "admin" && !a.revoked_at ? `<button class="btn sm danger" data-rv="${esc(a.email)}">Revoke</button>` : ""}</td></tr>`).join("")}</tbody></table>`;
            $("#aL").querySelectorAll("[data-rv]").forEach(b => b.onclick = async () => {
                if (!(await confirmDlg(`Revoke administrator access for ${b.dataset.rv}?`, "Revoke", true))) return;
                try { await api("/admin/admins/" + encodeURIComponent(b.dataset.rv), { method: "DELETE" }); load(); } catch (e) { note($("#aM"), msgFor(e.code)); }
            });
        } catch (e) { $("#aL").innerHTML = `<div class="msg err">${esc(msgFor(e.code))}</div>`; }
    }
    load();
}

(async function initAdminAuth() {
    try {
        await MFAuth.init();
        MFAuth.onAuthStateChange((_event, session) => {
            const previousToken = idToken;
            idToken = session && session.access_token ? session.access_token : null;
            if (idToken && !previousToken) boot();
            else if (!idToken && previousToken) { me = null; renderSignIn(); }
        });
        const session = await MFAuth.getSession();
        const previousToken = idToken;
        idToken = session && session.access_token ? session.access_token : null;
        if (idToken && !previousToken) boot();
        else if (!idToken && !previousToken) renderSignIn();
        if (new URLSearchParams(window.location.search).get("auth") === "recovery") MFLoginPanel.open("recovery");
    } catch (error) {
        console.error("Admin authentication initialization failed:", error);
        renderSignIn(msgFor("cloud_not_configured"));
    }
})();
